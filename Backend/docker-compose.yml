version: '3.8'

services:
  # MySQL Relational Database (CO1)
  mysql:
    image: mysql:8.0
    container_name: shipeasy_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Iamchaitanya@13542
      MYSQL_DATABASE: logistics_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - shipeasy_net

  # MongoDB Document Database (CO2)
  mongodb:
    image: mongo:7.0
    container_name: shipeasy_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shipeasy_net

  # FastAPI Backend API Gateway & Microservices (CO3, CO5)
  backend:
    build: .
    container_name: shipeasy_backend
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Iamchaitanya@13542
      - MYSQL_DB=logistics_app
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=logistics_app_mongo
      - JWT_SECRET=shipeasy_super_secret_jwt_key_2026_dbms_co3_co5
      - CANCELLATION_WINDOW_HOURS=5.0
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - mongodb
    networks:
      - shipeasy_net

  # Prometheus Observability (CO6)
  prometheus:
    image: prom/prometheus:latest
    container_name: shipeasy_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - shipeasy_net

volumes:
  mysql_data:
  mongo_data:

networks:
  shipeasy_net:
    driver: bridge
